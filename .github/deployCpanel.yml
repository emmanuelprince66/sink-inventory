name: Next.js cPanel Deployment

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js 20.17.0
        uses: actions/setup-node@v3
        with:
          node-version: '20.17.0'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deployment
          # Copy necessary files for production
          cp -r .next/ deployment/
          cp -r public/ deployment/public/
          cp -r package.json deployment/
          cp -r package-lock.json deployment/
          cp -r next.config.js deployment/
          # Include any other required files or configs

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deployment
          server-dir: ./public_html/  # cPanel's default web root
          exclude: |
            **/.git*
            **/.github*
            **/.vscode
            **/node_modules
